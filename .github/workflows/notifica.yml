name: Notifiche fisica

on:
  schedule:
    # 3 digest al giorno, alle 06:30, 12:30 e 18:30 UTC
    # = circa 7:30, 13:30 e 19:30 in Italia d'inverno (8:30, 14:30, 20:30 d'estate)
    - cron: "30 6,12,18 * * *"
  workflow_dispatch:   # permette di lanciarlo a mano dal sito
    inputs:
      anteprima:
        description: "Manda un digest di prova con gli ultimi articoli (non cambia lo stato)"
        type: boolean
        default: false

permissions:
  contents: write      # serve per salvare seen.json

concurrency:
  group: notifiche-fisica
  cancel-in-progress: false

jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install feedparser==6.0.11 requests deep-translator==1.11.4

      - name: Controlla i feed e invia su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIEW: ${{ inputs.anteprima }}
        run: python notify.py

      - name: Salva lo stato
        run: |
          git config user.name "notifiche-fisica"
          git config user.email "notifiche-fisica@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "aggiorna stato" && git push)
